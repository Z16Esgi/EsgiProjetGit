name: Lint

on:
  push:
    branches:
      - main
      - "GIT-*"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
       
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
     
        working-directory: ./laravel 
        run: npm install

      - name: Run linter
        working-directory: ./laravel
        run: npm run lint
